schema_version = 2
name = "loom-pp-cli"
display_name = "Loom"
description = "Your Loom library as a local, searchable archive: grep what you said, back up everything, and recap a week in one command."
project_kind = "cli"

[secrets.file]
path = "~/.config/loom-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
LOOM_COOKIE = true
